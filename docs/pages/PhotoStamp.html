<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<title>PhotoStamp</title>
<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    background: #ddd8d0;
    font-family: 'Georgia', 'Noto Serif SC', 'Songti SC', serif;
    padding: 40px 20px;
  }

  .weather-picker {
    width: 500px;
    margin-bottom: 24px;
  }
  .weather-picker-label {
    font-size: 11px;
    letter-spacing: 2px;
    color: #a8a298;
    margin-bottom: 8px;
  }
  .weather-options {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
  }
  .weather-opt {
    padding: 6px 14px;
    border: 1px solid #d6cdb8;
    background: #faf8f4;
    color: #6b6560;
    font-size: 12px;
    letter-spacing: 1px;
    cursor: pointer;
    border-radius: 20px;
    font-family: inherit;
    transition: all 0.2s;
  }
  .weather-opt:hover {
    border-color: #c9a96e;
    color: #3a3632;
  }
  .weather-opt.active {
    background: #c9a96e;
    color: #fff;
    border-color: #c9a96e;
  }

  #card {
    width: 500px;
    background: transparent;
    padding: 52px 56px 44px;
    position: relative;
  }

  #card::before {
    content: '';
    position: absolute;
    top: 0; left: 48px; right: 48px;
    height: 1px;
    background: #d6cdb8;
  }

  .row {
    display: flex;
    align-items: center;
    gap: 16px;
  }

  .row + .row {
    margin-top: 36px;
  }

  .icon-wrap {
    width: 36px;
    height: 36px;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .text-group {
    display: flex;
    flex-direction: column;
    gap: 3px;
  }

  .label {
    font-size: 10px;
    letter-spacing: 2.5px;
    color: #b8b0a2;
  }

  .value {
    font-size: 20px;
    color: #3a3632;
    letter-spacing: 0.5px;
    font-variant-numeric: tabular-nums;
  }

  .value .city {
    font-size: 21px;
    letter-spacing: 4px;
  }

  .sep {
    margin: 32px 0 0;
    border: none;
    height: 1px;
    background: linear-gradient(90deg, #d6cdb8 0%, transparent 100%);
    width: 60px;
  }

  .footer {
    margin-top: 28px;
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 9px;
    letter-spacing: 3px;
    color: #c4bba8;
  }
  .footer .dash {
    width: 12px;
    height: 1px;
    background: #c4bba8;
    display: inline-block;
  }

  .editable {
    outline: none;
    border-radius: 2px;
    transition: background 0.2s;
  }
  .editing .editable {
    background: rgba(201, 169, 110, 0.1);
    cursor: text;
  }
  .editing .editable:hover {
    background: rgba(201, 169, 110, 0.2);
  }
  .editing .editable:focus {
    background: rgba(201, 169, 110, 0.15);
    box-shadow: 0 0 0 2px rgba(201, 169, 110, 0.3);
  }

  .btn-group {
    margin-top: 40px;
    display: flex;
    gap: 16px;
  }
  .btn {
    padding: 10px 24px;
    border: 1px solid #b8b0a2;
    background: #faf8f4;
    color: #3a3632;
    font-size: 13px;
    letter-spacing: 1px;
    cursor: pointer;
    border-radius: 4px;
    font-family: inherit;
    transition: all 0.2s;
  }
  .btn:hover {
    background: #f0ece4;
    border-color: #a8a298;
  }
  .btn.active {
    background: #c9a96e;
    color: #fff;
    border-color: #c9a96e;
  }
</style>
</head>
<body>

  <div class="weather-picker">
    <div class="weather-picker-label">选择天气</div>
    <div class="weather-options">
      <button class="weather-opt" data-weather="sunny" onclick="setWeather('sunny')">☀️ 晴</button>
      <button class="weather-opt active" data-weather="cloudy" onclick="setWeather('cloudy')">⛅ 多云</button>
      <button class="weather-opt" data-weather="overcast" onclick="setWeather('overcast')">☁️ 阴</button>
      <button class="weather-opt" data-weather="lightrain" onclick="setWeather('lightrain')">🌦️ 小雨</button>
      <button class="weather-opt" data-weather="heavyrain" onclick="setWeather('heavyrain')">🌧️ 大雨</button>
      <button class="weather-opt" data-weather="snow" onclick="setWeather('snow')">🌨️ 雪</button>
    </div>
  </div>

  <div id="card">
    <div class="row">
      <div class="icon-wrap" id="weatherIconWrap">
        <svg width="30" height="30" viewBox="0 0 30 30" fill="none">
          <path d="M15 10 C15 10, 12 10, 10.5 12.5 C9 15, 10.5 17, 13 17 C13 19, 15 20, 17 19.5 C19 19, 20 17, 19.5 15 C21 14, 22 12.5, 21.5 10.5 C21 8.5, 19 8, 17.5 9" stroke="#b8b0a2" stroke-width="1.5" stroke-linecap="round" fill="none"/>
          <path d="M18 20 C18 20, 16 21, 14 20 C12 19, 12 17, 14 16 C14 14, 16 13, 18 13.5 C20 14, 21 15.5, 20.5 17.5 C22 17, 23.5 17.5, 24 19 C24.5 20.5, 23.5 22, 22 22 Z" fill="#e8e3da" stroke="#a8a298" stroke-width="1.2" stroke-linejoin="round"/>
        </svg>
      </div>
      <div class="text-group">
        <div class="label">拍摄时间</div>
        <div class="value editable">2026 / 09 / 06</div>
      </div>
    </div>

    <hr class="sep">

    <div class="row">
      <div class="icon-wrap">
        <svg width="34" height="22" viewBox="0 0 34 22" fill="none">
          <circle cx="3" cy="16" r="2" fill="#c9a96e"/>
          <path d="M5.5 16 C10 16, 12 6, 19 7 C22 7.5, 23 9, 24 10" stroke="#c9a96e" stroke-width="1.4" stroke-linecap="round" fill="none" stroke-dasharray="2 3"/>
          <path d="M27 5 C24.8 5, 23 6.8, 23 9 C23 12, 27 17, 27 17 C27 17, 31 12, 31 9 C31 6.8, 29.2 5, 27 5 Z" fill="#c9a96e"/>
          <circle cx="27" cy="9" r="1.8" fill="#faf8f4"/>
        </svg>
      </div>
      <div class="text-group">
        <div class="label">拍摄地点</div>
        <div class="value"><span class="city editable">合肥</span></div>
      </div>
    </div>

    <div class="footer">
      <span class="dash"></span>
      <span class="editable">PHOTO · 2026</span>
      <span class="dash"></span>
    </div>
  </div>

  <div class="btn-group">
    <button class="btn" id="editBtn" onclick="toggleEdit()">✏️ 编辑文字</button>
    <button class="btn" id="saveBtn" onclick="saveAsPng()">💾 保存 PNG</button>
  </div>

    </svg>`,

  function setWeather(type) {
    document.getElementById('weatherIconWrap').innerHTML = weatherIcons[type] || weatherIcons.cloudy;
    document.querySelectorAll('.weather-opt').forEach(btn => {
      btn.classList.toggle('active', btn.dataset.weather === type);
    });
  }

  let isEditing = false;
  function toggleEdit() {
    isEditing = !isEditing;
    document.getElementById('card').classList.toggle('editing', isEditing);
    document.getElementById('editBtn').classList.toggle('active', isEditing);
    document.getElementById('editBtn').textContent = isEditing ? '✅ 完成编辑' : '✏️ 编辑文字';
    document.querySelectorAll('.editable').forEach(el => {
      el.contentEditable = isEditing;
    });
    if (!isEditing) {
      document.querySelectorAll('.editable').forEach(el => {
        el.blur();
      });
    }
  }

  function saveAsPng() {
    const card = document.getElementById('card');
    html2canvas(card, {
      backgroundColor: null,
      scale: 2,
      useCORS: true
    }).then(canvas => {
      const link = document.createElement('a');
      link.download = 'photo-card.png';
      link.href = canvas.toDataURL('image/png');
      link.click();
    });
  }
</script>
</body>
</html>
